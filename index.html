  <style>
  /* Ajustes: CTAs em dourado, datas lado a lado no celular, botão flutuante centralizado */
  .cta-gold{background-image:linear-gradient(135deg,#F6DC93 0%,#DDB463 45%,#B98A3C 100%)!important;color:#2A0612!important;font-weight:700;box-shadow:0 12px 30px -10px rgba(221,180,99,.75),inset 0 1px 0 rgba(255,255,255,.55)!important;transition:transform .25s,filter .25s,box-shadow .25s}
  .cta-gold:hover{filter:brightness(1.07);box-shadow:0 16px 36px -10px rgba(221,180,99,.95),inset 0 1px 0 rgba(255,255,255,.6)!important}
  .cta-gold:focus-visible{outline:3px solid #FFE4EB;outline-offset:3px}
  .cta-float{position:fixed!important;width:calc(100% - 2rem);margin-inline:auto;--tw-ring-color:rgba(255,228,235,.7)}
  @media (max-width:639px){
    .chips-row{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem!important}
    .chips-row .chip{flex-direction:column;justify-content:center;text-align:center;gap:.35rem;padding:.75rem .35rem}
    .chips-row .chip .font-semibold{font-size:.95rem;white-space:nowrap}
  }
  .hp-field{position:absolute!important;left:-10000px!important;width:1px;height:1px;opacity:0;pointer-events:none}

  /* ================= ACABAMENTO: EFEITOS E DETALHES DE VIDA ================= */
  :root{--gold:#C9A45C;--gold-l:#F6DC93;--gold-d:#B98A3C}
  h1,h2,h3{text-wrap:balance}
  .hero-photo{overflow:hidden}
  .hero-photo img{height:calc(100% + 140px)!important;max-width:none}
  @media (max-width:1023px){.hero-photo img{object-position:50% 75%!important}}
  @media (max-width:639px){.live-tag{font-size:.68rem!important;padding:.2rem .65rem!important;gap:.55rem!important;letter-spacing:.14em!important}.live-tag .live-dot{width:.45rem!important;height:.45rem!important}}
  p{text-wrap:pretty}

  /* Barra dourada de progresso de leitura */
  #fx-progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:60;pointer-events:none;
    background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold));transform-origin:0 50%;transform:scaleX(var(--p,0));
    box-shadow:0 0 10px rgba(221,180,99,.6)}

  /* Linha dourada sob os títulos de seção */
  h2.font-display::after{content:"";display:block;width:72px;height:3px;margin-top:.9rem;border-radius:3px;
    background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold));transform-origin:left center}
  h2.text-center::after{margin-inline:auto;transform-origin:center}

  /* Cards "O que você vai descobrir" */
  .fx-card{position:relative;overflow:hidden;isolation:isolate;
    transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .45s}
  .fx-card>*:not(.fx-glow):not(.fx-line){position:relative;z-index:1}
  .fx-glow{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .4s;pointer-events:none;
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(221,180,99,.28),transparent 65%)}
  .fx-line{position:absolute;left:12%;right:12%;bottom:0;height:3px;border-radius:3px;z-index:1;
    background:linear-gradient(90deg,transparent,var(--gold),var(--gold-l),var(--gold),transparent);
    transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .fx-num{transform-origin:left bottom;transition:transform .45s cubic-bezier(.2,.7,.2,1),color .3s}
  .fx-card:hover{border-color:var(--gold)!important;box-shadow:0 26px 50px -22px rgba(114,29,60,.45),0 0 0 1px rgba(201,164,92,.35)!important}

  /* "Para quem é este workshop" */
  .fx-who{transition:background-color .35s,color .35s,transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
  .fx-who>span:nth-child(2){flex:1 1 auto}

  .fx-seal{transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s}

  @keyframes fx-rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  /* Títulos fora do efeito de entrada continuam com a linha visível */
  h2.font-display:not(.reveal h2)::after{transform:none}

  /* Seção "Quem é" no celular: selos, frase e botão centralizados */

    <!-- Formulário oculto: permite que o Netlify detecte e guarde as inscrições (Forms > inscricao) -->
    <form name="inscricao" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="inscricao" />
      <input name="nome" /><input name="whatsapp" /><input name="whatsappE164" /><input name="consentimento" />
      <input name="evento" /><input name="origem" /><input name="data" />

      <input name="bot-field" />

    <script>
      /* Acabamento: barra de progresso de leitura e brilho que acompanha o mouse nos cards */
      (function () {
        var bar = document.createElement("div");
        bar.id = "fx-progress"; bar.setAttribute("aria-hidden", "true");
        document.body.appendChild(bar);
        var ticking = false;
        function update() {
          var h = document.documentElement.scrollHeight - innerHeight;
          bar.style.setProperty("--p", h > 0 ? Math.min(1, scrollY / h) : 0);
          ticking = false;
        }
        addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
        addEventListener("resize", update); update();
        document.addEventListener("pointermove", function (e) {
          var card = e.target.closest && e.target.closest(".fx-card");
          if (!card) return;
          var r = card.getBoundingClientRect();
          card.style.setProperty("--mx", (e.clientX - r.left) + "px");
          card.style.setProperty("--my", (e.clientY - r.top) + "px");
        }, { passive: true });
      })();
    </script>
